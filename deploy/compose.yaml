# Reference deployment: one rootless Docker Compose project per pool instance.
# Copy this file per instance, set the variables below, and run it under a
# rootless Docker Engine >= 28.0.0 with Compose >= 2.20.2.
#
#   JAYNSHARE_IMAGE       the image by *index digest* — never a mutable tag
#   JAYNSHARE_CONFIG_DIR  an existing owner-only directory on the host holding
#                         `config.toml`, both owned by the service identity — the
#                         host subordinate uid that the image's uid 10001 maps to,
#                         not the invoking operator
#   JAYNSHARE_HOST_IP     one explicit loopback or private host address
#   JAYNSHARE_HOST_PORT   one explicit unique host port
#
# The Compose project name is the instance identity: run with
# `docker compose -p <name> -f compose.yaml up -d`, matching [a-z0-9][a-z0-9_-]{0,31}.
# Two instances on one host share no mount, network or published port pair, and
# only under a single trusted operator.
#
# Operator verbs run inside the project. Reads and control-plane
# mutations go through the server itself:
#
#   docker compose -p <name> exec server jaynshare status
#
# The file-editing verbs (`route`, `priority`, `block`, `config set|unset|edit`,
# verbs) need the configuration directory writable, which the server never
# has; they run in the one-shot `operator` container, which shares the server's
# network namespace so its loopback is the instance's and mounts the same
# directory read-write, so the atomic replacement is the file the server reloads:
#
#   docker compose -p <name> run --rm operator route add …
#
# While the server is stopped, `operator-offline` (no network) runs the
# file-backed verbs — `config validate`, `config edit --offline`, `config show
# --local`, `log tail`, `audit tail` — on the same mounts:
#
#   docker compose -p <name> run --rm operator-offline config edit --offline

services:
  server:
    # Pinned by digest; a tag would let the bytes move under the operator.
    image: ${JAYNSHARE_IMAGE:?set JAYNSHARE_IMAGE to the release index digest}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cgroup: private
    volumes:
      # The configuration directory, read-only in the server, holding exactly
      # one operator-supplied configuration file at the image's fixed
      # JAYNSHARE_CONFIG path (/etc/jaynshare/config.toml). Compose must not
      # create it if it is missing. A directory rather than a single-file bind
      # so that the `operator` container's atomic replacement (write beside,
      # rename over) is the inode the server reads at reload.
      - type: bind
        source: ${JAYNSHARE_CONFIG_DIR:?set JAYNSHARE_CONFIG_DIR to the owner-only configuration directory}
        target: /etc/jaynshare
        read_only: true
        bind: { create_host_path: false }
      # One project-scoped named volume at the image's service home holds
      # state, logs and trust material.
      - type: volume
        source: state
        target: /var/lib/jaynshare
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - internal
    # Long form, one explicit host IP and one explicit unique host port. The
    # target must equal the port the configured [data_plane] listen binds.
    ports:
      - mode: host
        protocol: tcp
        host_ip: ${JAYNSHARE_HOST_IP:?set JAYNSHARE_HOST_IP to an explicit private or loopback address}
        published: "${JAYNSHARE_HOST_PORT:?set JAYNSHARE_HOST_PORT to an explicit unique host port}"
        target: 17421
    # SIGTERM gets 30 s so the server can flush dirty state.
    stop_grace_period: 30s
    # Operator-adjustable, never omitted.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    # Standard output and error are size-rotated and separate from the
    # server's own log files, which live on the project volume.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The one-shot operator container: the same image and service identity as
  # the server, run with `docker compose run --rm operator <verb…>` and gone
  # afterwards. It is never started by `up` (the profile keeps it out), holds no
  # listener, and shares only what the verbs need: the server's network
  # namespace and the two mounts, the configuration directory read-write.
  operator:
    image: ${JAYNSHARE_IMAGE:?set JAYNSHARE_IMAGE to the release index digest}
    pull_policy: never
    profiles: [operator]
    restart: "no"
    network_mode: "service:server"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cgroup: private
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${JAYNSHARE_CONFIG_DIR:?set JAYNSHARE_CONFIG_DIR to the owner-only configuration directory}
        target: /etc/jaynshare
        bind: { create_host_path: false }
      # The log directory for `log tail` / `audit tail`; the CLI writes nothing here.
      - type: volume
        source: state
        target: /var/lib/jaynshare
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 64
    command: ["status"]

  # `operator` while the server is stopped: a stopped container has no network
  # namespace to join, so this one has no network at all. A verb that needs the
  # server exits 4 (`cli_unreachable`) without writing.
  operator-offline:
    extends:
      service: operator
    network_mode: none
    command: ["config", "validate"]

networks:
  # One private bridge, attached only to this project's server service.
  internal:
    driver: bridge

volumes:
  state:
