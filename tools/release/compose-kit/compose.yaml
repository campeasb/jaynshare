# Jaynshare Compose deployment kit. One release ships one kit; the
# release tool replaces the @IMAGE@ placeholder with the release index digest,
# so the image is pinned by digest and never by a mutable tag.
#
# Run one project per pool instance under rootless Docker Engine >= 28.0.0 with
# Compose >= 2.20.2: `docker compose -p <name> -f compose.yaml up -d`
# with the variables of env.example, or the `container install` verb, which
# does the same through the release kit. The project name is the instance
# identity: [a-z0-9][a-z0-9_-]{0,31}, unique.
#
#   JAYNSHARE_CONFIG_DIR  an existing owner-only directory on the host holding
#                         `config.toml`, both owned by the service identity
#                         — the host subordinate uid
#                         that the image's fixed numeric uid maps to, not the
#                         invoking operator
#   JAYNSHARE_HOST_IP     one explicit loopback or private host address
#   JAYNSHARE_HOST_PORT   one explicit unique host port
#   JAYNSHARE_CPUS        CPU limit, operator-adjustable, never omitted
#   JAYNSHARE_MEMORY      memory limit
#   JAYNSHARE_PIDS        process limit
#
# No secret, credential or configuration value is read or set here:
# credentials live in the configuration file and the project volume only.

services:
  server:
    # The release tool pins this to <repository>@sha256:<index digest>.
    image: "@IMAGE@"
    # The install verb pulls and verifies the digest itself.
    pull_policy: never
    restart: unless-stopped
    # Read-only root, no capabilities, no privilege escalation, a
    # private cgroup namespace, and a size-bounded tmpfs for /tmp. The image
    # already runs as a fixed numeric non-root uid with a fixed home.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cgroup: private
    tmpfs:
      - /tmp:size=16m,mode=1777
    # Exactly one operator-supplied configuration file, read-only at
    # the image's fixed JAYNSHARE_CONFIG path, and Compose must not create the
    # host path if it is missing. One project-scoped named volume at the image
    # service home holds state, logs and trust material.
    volumes:
      - type: bind
        source: ${JAYNSHARE_CONFIG_DIR:?set JAYNSHARE_CONFIG_DIR to the owner-only configuration directory}/config.toml
        target: /etc/jaynshare/config.toml
        read_only: true
        bind: { create_host_path: false }
      - type: volume
        source: state
        target: /var/lib/jaynshare
    # The only environment entry is the fixed configuration path.
    environment:
      JAYNSHARE_CONFIG: /etc/jaynshare/config.toml
    networks:
      - pool
    # Long form only, one explicit host IP and one explicit unique
    # host port. The target must equal the port the configured [data_plane]
    # listen binds.
    ports:
      - mode: host
        protocol: tcp
        host_ip: ${JAYNSHARE_HOST_IP:?set JAYNSHARE_HOST_IP to an explicit loopback or private address}
        published: "${JAYNSHARE_HOST_PORT:?set JAYNSHARE_HOST_PORT to an explicit unique host port}"
        target: 17421
    # Operator-adjustable, never omitted.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${JAYNSHARE_CPUS:-1.0}"
          memory: ${JAYNSHARE_MEMORY:-512m}
          pids: ${JAYNSHARE_PIDS:-128}
    # SIGTERM gets 30 s so the server can flush dirty state.
    stop_grace_period: 30s
    # The health check is the binary's own loopback operator status read, in
    # the output-free `--check` form.
    healthcheck:
      test: ["CMD", "/usr/local/bin/jaynshare", "status", "--check"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Standard output and error are size-rotated and distinct from the
    # server's own log files, which live on the project volume.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # One private bridge, attached only to this project's server.
  pool:
    driver: bridge

volumes:
  state:
